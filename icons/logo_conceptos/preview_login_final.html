<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;padding:30px;display:flex;flex-direction:column;align-items:center;gap:40px}
h1{color:#fff;font-size:20px}
.preview{width:480px;height:340px;border-radius:16px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.label{position:absolute;bottom:12px;left:16px;color:#fff;background:rgba(0,0,0,0.6);padding:4px 12px;border-radius:6px;font-size:13px;z-index:10}

/* Opción 2 final: grid + mburucuyá watermark */
.opt2{background:#F5F7FA;background-image:
  linear-gradient(rgba(91,42,134,0.03) 1px,transparent 1px),
  linear-gradient(90deg,rgba(91,42,134,0.03) 1px,transparent 1px);
  background-size:20px 20px}
.opt2 .logo{display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;position:relative}
.opt2 .slogan{font-size:11px;color:#5A6470}
</style>
</head>
<body>
<h1>Opción 2 — Grid + marca de agua mburucuyá</h1>

<div class="preview opt2">
  <div class="label">Grid 3% + mburucuyá 5% opacidad</div>
  <!-- Marca de agua flor -->
  <svg style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0.05;z-index:1" width="300" height="300" viewBox="0 0 200 200">
    <g fill="#5B2A86">
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(0 100 100)"/>
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(60 100 100)"/>
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(120 100 100)"/>
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(180 100 100)"/>
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(240 100 100)"/>
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(300 100 100)"/>
    </g>
    <g fill="#4A7C59" opacity="0.7">
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(30 100 100)"/>
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(90 100 100)"/>
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(150 100 100)"/>
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(210 100 100)"/>
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(270 100 100)"/>
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(330 100 100)"/>
    </g>
    <circle cx="100" cy="100" r="12" fill="#4A7C59"/>
  </svg>
  <!-- Logo -->
  <div class="logo">
    <svg viewBox="0 0 200 60" width="180" height="54">
      <rect x="8" y="12" width="5" height="5" rx="1" fill="#4A7C59"/>
      <rect x="15" y="10" width="5" height="5" rx="1" fill="#4A7C59"/>
      <rect x="22" y="12" width="5" height="5" rx="1" fill="#4A7C59"/>
      <rect x="6" y="22" width="6" height="6" rx="1" fill="#5B2A86"/>
      <rect x="6" y="30" width="6" height="6" rx="1" fill="#5B2A86"/>
      <rect x="6" y="38" width="6" height="6" rx="1" fill="#5B2A86"/>
      <rect x="6" y="46" width="6" height="6" rx="1" fill="#5B2A86"/>
      <rect x="14" y="22" width="6" height="6" rx="1" fill="#5B2A86"/>
      <rect x="22" y="30" width="6" height="6" rx="1" fill="#5B2A86"/>
      <rect x="30" y="38" width="6" height="6" rx="1" fill="#5B2A86"/>
      <rect x="30" y="22" width="6" height="6" rx="1" fill="#5B2A86"/>
      <rect x="30" y="30" width="6" height="6" rx="1" fill="#5B2A86"/>
      <rect x="30" y="46" width="6" height="6" rx="1" fill="#5B2A86"/>
      <text x="40" y="45" font-family="'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#5B2A86">ande</text>
      <text x="88" y="45" font-family="'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#4A7C59">ERP</text>
    </svg>
    <div class="slogan">ERP paraguayo. Cumplimiento real. Soporte local.</div>
  </div>
</div>
</body>
</html>
